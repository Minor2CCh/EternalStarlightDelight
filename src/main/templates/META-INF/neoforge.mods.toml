type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "farmersdelight"
type = "required"
versionRange = "[1.3.0, )"
ordering = "AFTER"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "eternal_starlight"
type = "required"
versionRange = "[0.7.0,)"
ordering = "AFTER"
side = "BOTH"

[[mixins]]
config = "eternal_starlight_delight.mixins.json"

[[mixins]]
config = "eternal_starlight_delight-neoforge.mixins.json"
