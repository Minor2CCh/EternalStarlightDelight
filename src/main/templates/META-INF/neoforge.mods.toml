modLoader = "javafml"
loaderVersion = "${loader_version_range}"
#issueTrackerURL = ""
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "Eternal Starlight's Delight"
authors = "${mod_authors}"
credits = "TohokuAlpha"
description = '''
${mod_description}
'''
logoFile = "icon.png"
displayURL = "https://github.com/Minor2CCh/EternalStarlightDelight"

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
